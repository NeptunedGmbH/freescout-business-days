# Attach SHA256SUMS to a GitHub release that already contains BusinessDays.zip.
# UpdateGuard reads sha256sumsUrl from module.json, which points at this asset.
name: Publish SHA256SUMS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to hash. Empty uses the latest release.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sha256sums:
    runs-on: ubuntu-latest
    steps:
      - name: Hash the release zip and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi

          work="$(mktemp -d)"
          gh release download "$tag" --pattern BusinessDays.zip --dir "$work" --clobber
          test -f "$work/BusinessDays.zip"
          (
            cd "$work"
            sha256sum BusinessDays.zip
          ) > "$work/SHA256SUMS"
          grep -Eq '^[a-f0-9]{64}  BusinessDays\.zip$' "$work/SHA256SUMS"
          cat "$work/SHA256SUMS"
          gh release upload "$tag" "$work/SHA256SUMS" --clobber
